appId: com.deployx.app
productName: DeployX
copyright: Copyright © DeployX
npmRebuild: false
nodeGypRebuild: false
directories:
  # 放到仓库外，避免本机 Cursor 监视/打开 release 时锁住 app.asar 导致 EBUSY
  output: ../deployx-release
  buildResources: build
files:
  - electron/**/*
  - package.json
extraResources:
  - from: desktop-staging/app
    to: app
    filter:
      - "**/*"
      - "!node_modules"
      - "!node_modules/**"
  - from: desktop-staging/node
    to: node
asar: true
afterPack: scripts/after-pack.mjs
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeployX
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  target:
    - AppImage
  artifactName: ${productName}-${version}.${ext}
